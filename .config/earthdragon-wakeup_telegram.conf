##  地牛 Wake Up to Telegram 地震通知（Windows / PowerShell 版）設定檔
##  Earth Dragon (Diniu) Wake Up to Telegram Earthquake Alert (Windows / PowerShell Version) Configuration File
##
##  一行一項：KEY = 值。# 之後是註解；字串加單引號，數字與 true/false 不加。
##
##  逐項說明與預設值見 README.md 第三章；改完試跑見步驟 (4)。
##
##  編碼維持 UTF-8，不要存成 ANSI，否則中文會變亂碼。


## A API、頻道帳號名稱、所在地區 ──────────────────────────────────
TELEGRAM_BOT_TOKEN = '請輸入 BotFather 給的 BOT_TOKEN'                    # BotFather 取得，例如 123456789:AAH...
TELEGRAM_CHAT_IDS  = '請輸入接收警報的ID'                                  # 多個用逗號、分號、空白或換行分隔，例如 '123456789'、'123456789,-1001234567890'、'@channel_username'
ALERT_LOCATION     = '臺北市'                                             # 只出現在文字警報的「所在地區」。這個欄位不做地理編碼、不算距離、不影響地圖，也不影響收不收得到警報。
GEOAPIFY_API_KEY   = '請輸入 Geoapify API'                                # 留空則不畫震央地圖，只送文字警報


## B · 通知行為 ────────────────────────────────────────────────
TELEGRAM_MESSAGE_THREAD_ID        = ''                                   # Telegram Forum Topic 的 topic id；一般私人聊天、群組或頻道請留空
TELEGRAM_DISABLE_NOTIFICATION     = false                                # true = 文字靜音
TELEGRAM_MAP_DISABLE_NOTIFICATION = true                                 # true = 地圖靜音，建議避免響兩次
TELEGRAM_PROTECT_CONTENT          = false                                # true = 禁止轉傳與儲存
TELEGRAM_MAX_TIME                 = 20                                   # 秒；單次請求的整體上限
TELEGRAM_CONNECT_TIMEOUT          = 10                                   # 秒；保留相容，實際以 MAX_TIME 為準


## C · 地圖 ────────────────────────────────────────────────────
MAP_ENABLED         = true                                               # false = 完全不產生地圖
MAP_STYLE           = 'osm-bright'                                       # Geoapify 樣式名稱
MAP_LANG            = 'zh'                                               # 地圖標籤語言
MAP_WIDTH           = 900                                                # 像素，上限 4096
MAP_HEIGHT          = 900                                                # 像素，上限 4096
MAP_SCALE_FACTOR    = 1                                                  # 2 = 高解析度，API 用量與檔案加倍
MAP_MAX_TIME        = 30                                                 # 秒
MAP_CONNECT_TIMEOUT = 10                                                 # 秒；保留相容


## D · 震央地名 ────────────────────────────────────────────────
REVERSE_GEOCODING_ENABLED         = true                                 # false = 地圖說明省略「震央附近」
REVERSE_GEOCODING_LANG            = 'zh'                                 # 地名語言
REVERSE_GEOCODING_MAX_TIME        = 15                                   # 秒
REVERSE_GEOCODING_CONNECT_TIMEOUT = 10                                   # 秒；保留相容


## E · 顯示與日誌 ──────────────────────────────────────────────
ALERT_TIMEZONE = 'Asia/Taipei'                                           # 會自動對應成 Windows 的時區 ID
LOG_FILE       = ''                                                      # 留空 = 只寫到主控台；建議填絕對路徑


## F · 地圖範圍與標記 ──────────────────────────────────────────
##   以台灣為基礎框，再自動擴張到震央。通常不需要動。
MAP_TAIWAN_WEST          = 119.0                                         # 西界
MAP_TAIWAN_EAST          = 123.0                                         # 東界
MAP_TAIWAN_NORTH         = 26.0                                          # 北界
MAP_TAIWAN_SOUTH         = 21.5                                          # 南界
MAP_PADDING              = 0.35                                          # 邊緣留白（經緯度）
MAP_MARKER_COLOR         = '#e53935'                                     # 標記底色
MAP_MARKER_STROKE_COLOR  = '#8b0000'                                     # 標記外框
MAP_MARKER_CONTENT_COLOR = '#ffffff'                                     # 標記內文字色
MAP_MARKER_SIZE          = 72                                            # 標記像素高
MAP_MARKER_CONTENT_SIZE  = 34                                            # 標記內文字像素


## G · 選用端點 ────────────────────────────────────────────────
##   只有在走自架 Proxy 或測試伺服器時，才把下面三行取消註解。
# TELEGRAM_API_BASE     = 'https://api.telegram.org'
# GEOAPIFY_MAP_BASE     = 'https://maps.geoapify.com'
# GEOAPIFY_GEOCODE_BASE = 'https://api.geoapify.com'

